<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16a34a" />
  <title>長野デジタル安全クイズに挑戦！</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <style>
    :root{
      --blue:#1f6feb; --blue-d:#1648b0; --green:#16a34a; --green-d:#0f7a36;
      --purple:#7c3aed; --purple-d:#5b21b6; --red:#dc2626; --amber:#f59e0b;
      --ink:#1f2430; --muted:#64748b; --line:#e6e9f0; --bg:#f3f6fb; --card:#ffffff;
      --ok-bg:#e7f8ee; --ng-bg:#fdeaea;
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
      color:var(--ink); background:var(--bg); line-height:1.6;
      -webkit-text-size-adjust:100%;
    }
    .wrap{max-width:540px; margin:0 auto; padding:0 16px 40px; min-height:100vh; display:flex; flex-direction:column;}
    header.app{
      background:linear-gradient(135deg,var(--green),#3b82f6); color:#fff;
      border-radius:0 0 22px 22px; padding:18px 18px 16px; margin:0 -16px 18px;
      box-shadow:0 6px 18px rgba(22,163,74,.25);
    }
    header.app .ev{font-size:12px; opacity:.9; letter-spacing:.04em;}
    header.app h1{font-size:19px; margin:2px 0 0; font-weight:800; letter-spacing:.01em;}
    header.app .sub{font-size:12.5px; opacity:.95; margin-top:4px;}
    .card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:0 2px 10px rgba(20,40,80,.04); margin-bottom:14px;}
    
    /* 景品目玉バナー用スタイル */
    .prize-banner{
      background:linear-gradient(135deg, #f59e0b, #ef4444);
      color:#fff; border-radius:16px; padding:16px; text-align:center;
      box-shadow:0 4px 14px rgba(245,158,11,.35); margin-bottom:14px;
      border:2px solid #fbbf24;
    }
    .prize-banner .badge{
      display:inline-block; background:#fff; color:#d97706; font-size:12px;
      font-weight:900; padding:3px 10px; border-radius:999px; letter-spacing:.03em;
    }
    .prize-banner h3{
      font-size:22px; font-weight:900; margin:6px 0 2px; line-height:1.2; letter-spacing:.02em;
    }
    .prize-banner .sub-txt{
      font-size:13px; font-weight:700; opacity:.95; margin:0;
    }

    h2{font-size:18px; margin:2px 0 10px; font-weight:800;}
    p.lead{color:var(--muted); font-size:14px; margin:0 0 14px;}
    .btn{
      display:flex; align-items:center; gap:10px; width:100%; border:none; cursor:pointer;
      font-family:inherit; font-size:16px; font-weight:700; color:#fff; background:var(--green);
      padding:15px 16px; border-radius:14px; text-align:left; transition:transform .05s ease, filter .15s ease;
    }
    .btn:active{transform:scale(.985);}
    .btn.lg{font-size:17px; padding:17px;}
    .btn.green{background:var(--green);} .btn.purple{background:var(--purple);}
    .btn.ghost{background:#eef2f9; color:var(--ink); font-weight:700; border:1px solid var(--line);}
    .btn.amber{background:var(--amber); color:#3a2a00;}
    .btn .emj{font-size:22px; line-height:1;}
    .btn .meta{font-size:12px; font-weight:600; opacity:.92; display:block; margin-top:2px;}
    .btn .col{display:flex; flex-direction:column;}
    .row{display:flex; gap:10px;}
    .row .btn{flex:1;}
    .pill{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; background:#eef2f9; color:var(--muted);}
    .pill.safety{background:#e7f8ee; color:var(--green-d);}
    .pill.ai{background:#e8f0ff; color:var(--blue-d);}
    .pill.easy{background:#e7f8ee; color:var(--green-d);}
    .pill.hard{background:#f1e9ff; color:var(--purple-d);}
    .note{font-size:12px; color:var(--muted); background:#f6f8fc; border:1px dashed var(--line); border-radius:12px; padding:10px 12px;}
    .progress{height:9px; background:#e8edf6; border-radius:999px; overflow:hidden; margin:4px 0 14px;}
    .progress > i{display:block; height:100%; background:linear-gradient(90deg,var(--green),#5b9bff); border-radius:999px; transition:width .25s ease;}
    .qhead{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--muted); margin-bottom:6px;}
    .qtext{font-size:18px; font-weight:800; margin:2px 0 14px; line-height:1.5;}
    .choice{
      width:100%; text-align:left; background:#fff; border:2px solid var(--line); color:var(--ink);
      font-family:inherit; font-size:15.5px; font-weight:600; padding:14px 14px; border-radius:13px;
      margin-bottom:10px; cursor:pointer; display:flex; gap:10px; align-items:flex-start; line-height:1.45;
    }
    .choice:active{transform:scale(.99);}
    .choice .mk{flex:0 0 26px; height:26px; border-radius:50%; background:#eef2f9; color:var(--muted); font-weight:800; display:flex; align-items:center; justify-content:center; font-size:14px;}
    .choice.ok{border-color:var(--green); background:var(--ok-bg);}
    .choice.ok .mk{background:var(--green); color:#fff;}
    .choice.ng{border-color:var(--red); background:var(--ng-bg);}
    .choice.ng .mk{background:var(--red); color:#fff;}
    .choice.dim{opacity:.6;}
    .choice:disabled{cursor:default;}
    .fb{border-radius:13px; padding:12px 14px; margin:4px 0 12px; font-size:14px; font-weight:600;}
    .fb.ok{background:var(--ok-bg); color:var(--green-d);}
    .fb.ng{background:var(--ng-bg); color:#9b1c1c;}
    .fb .ttl{font-weight:800; display:block; margin-bottom:2px;}
    .easy .qtext{font-size:19px;}
    .easy .choice{font-size:16.5px;}
    .result-score{text-align:center; padding:6px 0 2px;}
    .result-score .big{font-size:46px; font-weight:900; line-height:1; color:var(--green);}
    .result-score .big small{font-size:20px; color:var(--muted); font-weight:800;}
    .prize{border-radius:16px; padding:16px; text-align:center; margin:12px 0; color:#fff;}
    .prize.top{background:linear-gradient(135deg,#f59e0b,#f97316);}
    .prize.part{background:linear-gradient(135deg,#34a0ff,#1f6feb);}
    .prize .lab{font-size:12px; font-weight:700; opacity:.95;}
    .prize .name{font-size:24px; font-weight:900; margin-top:2px;}
    .prize .emj{font-size:30px;}
    .staff{font-size:17px; font-weight:900; color:var(--ink); background:#fff3cd; border:2px solid var(--amber); border-radius:12px; padding:12px 10px; margin-top:6px; letter-spacing:.02em; text-align:center;}
    .cta{background:#f0f6ff; border:1px solid #d6e6ff; border-radius:16px; padding:14px; margin-top:6px;}
    .cta h3{margin:0 0 8px; font-size:15px;}
    .cta ul{margin:0; padding-left:18px; font-size:13.5px; color:#334155;}
    .cta li{margin:4px 0;}
    footer.app{margin-top:auto; padding-top:14px; text-align:center; font-size:11.5px; color:var(--muted);}
    footer.app a{color:var(--muted);}
    .admin h2{margin-top:0;}
    table{width:100%; border-collapse:collapse; font-size:12.5px;}
    th,td{border-bottom:1px solid var(--line); padding:7px 6px; text-align:left; vertical-align:top;}
    th{color:var(--muted); font-weight:700; font-size:11.5px;}
    td.num,th.num{text-align:right; white-space:nowrap;}
    .bar{height:7px; background:#eef2f9; border-radius:999px; overflow:hidden; margin-top:3px;}
    .bar > i{display:block; height:100%; background:var(--green);}
    .bar.low > i{background:var(--red);} .bar.mid > i{background:var(--amber);} .bar.high > i{background:var(--green);}
    .kpis{display:flex; gap:8px; flex-wrap:wrap;}
    .kpi{flex:1; min-width:90px; background:#f6f8fc; border:1px solid var(--line); border-radius:12px; padding:10px 12px;}
    .kpi .v{font-size:22px; font-weight:900;}
    .kpi .k{font-size:11px; color:var(--muted);}
    .setblock{margin:12px 0 4px;}
    .setblock h3{font-size:14px; margin:0 0 4px; display:flex; gap:8px; align-items:center;}
    .banner{background:#fff7e6; border:1px solid #ffe2a8; color:#7a5200; border-radius:12px; padding:10px 12px; font-size:12.5px; margin-bottom:12px;}
    details.help{margin-top:8px;} details.help summary{cursor:pointer; font-size:13px; font-weight:700; color:var(--blue-d);}
    .hint{font-size:12px; color:var(--muted); margin-top:6px;}
    .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
    .link{background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; font-family:inherit; text-decoration:underline; padding:0;}
  </style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <div class="ev" id="evName">SMARTLIFE AO 長野校 稲里キャンパス in 清泉大学文化祭</div>
    <h1>長野デジタル安全クイズ 🛡️🌲</h1>
    <div class="sub" id="evSub">不正アクセスや最新ニュースから学べる防犯クイズ！</div>
  </header>
  <div id="app" aria-live="polite"></div>
  <footer class="app">
    <div>個人情報は一切取得・送信しません。</div>
  </footer>
</div>

<input type="file" id="importFile" accept="application/json,.json" multiple hidden />

<script>
/* ============================================================
   設定
   ============================================================ */
const CONFIG = {
  prizeThreshold: 7, // 7問全問正解で特別賞
  topPrize:        "Google Home Mini（全問正解）",
  topPrizeEmoji:   "🎁",
  partPrize:       "オリジナルノベルティ（参加賞）",
  partPrizeEmoji:  "✨",
  eventName: "SMARTLIFE AO 長野校 稲里キャンパス in 清泉大学文化祭",
  eventSub:  "長野の身近な不正アクセス・AI詐欺・防災を学ぼう！",
  cta: {
    title: "📣 楽しく学んで、自分と家族を守ろう！",
    items: [
      "不正ログイン被害を防ぐため、パスワード使い回しをやめて手帳で保管しましょう！",
      "長野県内で多発する『ニセ警察官詐欺』や『AIディープフェイク音声』に注意！",
      "二段階認証コードや認証番号は『他人に絶対に教えない』を徹底しましょう！"
    ]
  },
  submitUrl: "",
  storeKey: "nagano_safety_quiz_v8",
  adminPin: ""
};

/* ============================================================
   クイズデータ（不正アクセス・長野県ニュース・AI対策・『安全のしおり Vol.4 第3章』準拠）
   ============================================================ */
const QUIZ_DATA = {
  safety: {
    label: "詐欺対策・防災編", emoji: "🚨",
    easy: [
      {q:"長野県内でおうちの固定電話に、知らない番号から「長野県警の警察官」や「息子」を名乗って『お金が必要だ』と電話がきたら？",
       choices:["急いでお金を用意する","一度電話を切って、おうちの人や警察（#9110）に確認する","友達に電話する"], answer:1,
       explain:"長野県内では警察官や家族を装うニセ電話詐欺が多発中！電話口の言葉を鵜呑みにせず、必ず一度切って確かめましょう。（参照：長野県警察「電話でお金詐欺警報」・『安全のしおりVol.4 第3章』P.45）"},
      {q:"AI（人工知能）で家族の声を本物そっくりに作った「ニセのSOS電話」が急増中！怪しい電話を見抜く一番効果的な家族の約束は？",
       choices:["家族だけで決めた『ひみつの合言葉』で確認する","声が本物っぽいからすぐ信じる","メールで返信する"], answer:0,
       explain:"わずか数秒の音声データからAIで声が複製される時代です。家族間だけの合言葉で確認するのが最も安全です！（参照：総務省「AI生成音声・なりすまし注意報」・『安全のしおりVol.4 第3章』P.44-45）"},
      {q:"信州の厳しい冬（大雪や凍結）。車で出かけるとき、長時間閉じ込め時や災害時のスマホ充電に備えて『ガソリン』はどうしておく？",
       choices:["空っぽにしておく","こまめに『満タン』にしておく（暖房や充電を維持するため）","半分以下にする"], answer:1,
       explain:"大雪での立ち往生時、ガソリンが満タンであれば車内暖房やスマホ充電を維持でき、命を守ることにつながります。（参照：長野県防災情報「冬期の車両立ち往生対策」・『安全のしおりVol.4 第3章』P.21）"},
      {q:"スマホに「宅配便の不在通知です。確認はこちら」と知らないURLつきメールが届いたらどうする？",
       choices:["すぐにURLをタップする","開かずに放置するか、公式アプリ・公式サイトから確認する","友達に転送する"], answer:1,
       explain:"偽サイトへ誘導してIDやパスワードを盗み取る『フィッシング詐欺』です。「開けない・急がない」を徹底しましょう！（参照：警察庁サイバー警察局「フィッシング対策」・『安全のしおりVol.4 第3章』P.26-27）"},
      {q:"長野県で地震が発生！強い揺れを感じたら、最初にすることは？",
       choices:["あわてて外へ飛び出す","頭を守って低い姿勢をとる（机の下に入るなど）","大声を出して走る"], answer:1,
       explain:"まずは落下物から自分の頭を守ることが第一です。安全を確保してから状況を確認しましょう。（参照：消防庁「地震発生時の行動防止指針」・『安全のしおりVol.4 第3章』P.10）"},
      {q:"台風や豪雨のとき、自宅周辺の浸水・土砂災害リスクをスマホやPCで調べる一番確実なツールは？",
       choices:["市町村が配布・公開している『ハザードマップ』","過去の天気予報","SNSの噂話"], answer:0,
       explain:"長野県内には災害警戒区域が多数あります。日頃からスマホ等で自治体の『ハザードマップ』を確認しておきましょう。（参照：国土交通省「ハザードマップポータル」・『安全のしおりVol.4 第3章』P.11）"},
      {q:"一人でお留守番をしているときに、知らない人が来てチャイムを鳴らしたらどうする？",
       choices:["すぐにドアを開ける","カギを開けずに対応し、おうちの人に連絡する","部屋で静かに遊ぶ"], answer:1,
       explain:"一人留守番のときは安易にカギを開けない習慣を徹底しましょう。（参照：長野県警察「防犯の心得」・『安全のしおりVol.4 第3章』P.18）"},
    ],
    hard: [
      {q:"【長野県警発表】2025年の長野県内の「電話でお金詐欺」や「SNS型詐欺」の年間被害額は過去最悪の約何億円？",
       choices:["約1億円","約10億円","過去最悪の約38億円"], answer:2,
       explain:"長野県内の年間被害額は過去最悪の約38億円に達しました！特に『ニセ警察官詐欺』や暗号資産・金地金の騙し取りが多発しています。（参照：NBS長野放送・長野県警まとめ報道）"},
      {q:"安曇野市や上水内郡で暗号資産や現金が高額騙し取られる被害が相次ぐ中、1件あたりの過去最高被害額はおよそいくら？",
       choices:["約100万円","約1,000万円","1億円以上（約1億100万円）"], answer:2,
       explain:"安曇野市で1億100万円余りが騙し取られたほか、上水内郡でも1,780万円相当の暗号資産被害が発生するなど高額化しています。（参照：読売新聞・長野県警事件広報）"},
      {q:"上田市などで多発する詐欺電話に対し、長野県警察が「ニセ電話詐欺防止」に最も効果的として強く推奨している対策は？",
       choices:["常に『留守番電話設定』にして直接犯人と話さない","電話機の横にメモを貼る","非通知着信のみ拒否する"], answer:0,
       explain:"『犯人と直接会話をしない』ことが最大の防犯です。長野県警は固定電話を常に留守番電話に設定しておくことを強く推奨しています。（参照：長野県警察「ニセ電話詐欺対策」・『安全のしおりVol.4 第3章』P.47）"},
      {q:"長野県内で急増する『ニセ警察官詐欺』。「あなたの口座が犯罪に使われた。全額指定口座へ送金しろ」と言われた際の正しい対応は？",
       choices:["指定された『安全な口座』へ送金する","一度切り、警察相談専用電話（#9110）や地元警察署の公式番号に確認する","LINEで送られてきた警察手帳の画像を見る"], answer:1,
       explain:"警察官が電話やSNSで資産の送金を指示することは100%ありません！SNSで送られてくる警察手帳や逮捕状の画像もすべて偽物です。（参照：警察庁「SOS47 ニセ警察官詐欺注意喚起」・『安全のしおりVol.4 第3章』P.47）"},
      {q:"AI（生成AI）を悪用した最新の詐欺手口。「本物そっくり偽WEBサイト」に誘い込まれた際、被害を防ぐ決定的なチェックポイントは？",
       choices:["画面デザインが本物っぽいか確かめる","ブラウザの「URL（ドメイン名）」を確認し、ブックマークからアクセスする","「タイムセール中」の表示を信じる"], answer:1,
       explain:"AIによりロゴやデザインは完璧に模倣されます。アクセス先のURL（ドメイン名）の確認や、公式アプリ・ブックマークからの直接アクセスが鉄則です。（参照：NBSニュース「生成AIで防ぐ新技術」・『安全のしおりVol.4 第3章』P.35）"},
      {q:"大雪や地震による停電からの復旧時、倒れた暖房器具等から発生する『通電火災』を防ぐ避難時の鉄則は？",
       choices:["ブレーカーを落としてから避難する","電気ヒーターの電源をすべてONにしておく","コンセントに水をかける"], answer:0,
       explain:"停電復旧時に再通電して火災になるケースが多発しています。避難時の『ブレーカーOFF』は命と家財を守る基本行動です。（参照：消防庁「通電火災対策指針」・『安全のしおりVol.4 第3章』P.11）"},
      {q:"AIチャットボットや自動音声ガイダンス対応時の『安全のしおり Vol.4』が定める重要なルールは？",
       choices:["AIに名前・住所・暗証番号・クレジットカード情報を入力しない","AIなら安全なので何でも教えてよい","生年月日を教える"], answer:0,
       explain:"顔の見えないAIや自動音声にあなたやご家族の個人情報・暗証番号を入力してはいけません。一度送信された情報は取り消せません。（参照：総務省注意喚起・『安全のしおりVol.4 第3章』P.42-43）"},
    ],
  },
  ai: {
    label: "ネット安全・防犯編", emoji: "🌐",
    easy: [
      {q:"【不正アクセス対策】LINEやInstagramで友達から「認証コード（数桁の数字）を教えて！」とメッセージが来たらどうする？",
       choices:["友達だからすぐに教える","自分のアカウントが乗っ取られるので絶対に教えず、別の手段で本人に確認する","SNSに投稿する"], answer:1,
       explain:"友人のアカウントが既に不正アクセスで乗っ取られている可能性が高いです！二段階認証コードを他人に教えると、自身のアカウントも奪われてしまいます。（参照：警察庁サイバー警察局・『安全のしおりVol.4 第3章』P.29）"},

/* ---- オンライン送信＋オフライン退避 ---- */
function queueLoad(){ try{ return JSON.parse(localStorage.getItem(CONFIG.storeKey+"_queue"))||[]; }catch(e){ return []; } }
function queueSave(q){ try{ localStorage.setItem(CONFIG.storeKey+"_queue", JSON.stringify(q)); }catch(e){} }
function sendResult(resp){
  if(!CONFIG.submitUrl) return;
  fetch(CONFIG.submitUrl, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(resp)})
    .catch(()=>{ const q=queueLoad(); q.push(resp); queueSave(q); });
}
function flushQueue(){
  if(!CONFIG.submitUrl) return;
  const items=queueLoad(); if(!items.length) return;
  let remaining=items.length, failed=[];
  items.forEach(it=>{
    fetch(CONFIG.submitUrl, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(it)})
      .catch(()=>{ failed.push(it); })
      .finally(()=>{ if(--remaining===0){ queueSave(failed); if(location.hash==="#admin") render(); } });
  });
}

/* ============================================================
   クイズ進行
   ============================================================ */
function shuffleQuestions(cat, diff){
  return QUIZ_DATA[cat][diff].map(q=>{
    const idx = [0,1,2];
    for(let i=idx.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [idx[i],idx[j]] = [idx[j],idx[i]];
    }
    const newChoices = idx.map(i=>q.choices[i]);
    const newAnswer  = idx.indexOf(q.answer);
    return {...q, choices:newChoices, answer:newAnswer};
  });
}

function startQuiz(cat,diff){
  state.category=cat; state.difficulty=diff; state.qIndex=0; state.answers=[]; state.locked=false; state.saved=false; state.view="quiz";
  state.shuffled = shuffleQuestions(cat, diff);
  render();
}
function currentQ(){ return state.shuffled[state.qIndex]; }
function choose(i){
  if(state.locked) return;
  const q=currentQ();
  state.answers[state.qIndex]={chosen:i, correct:i===q.answer};
  state.locked=true; render();
}
function next(){
  if(state.qIndex<state.shuffled.length-1){ state.qIndex++; state.locked=false; render(); }
  else finish();
}
function finish(){
  if(!state.saved){
    const qs=state.shuffled;
    const score=state.answers.filter(a=>a&&a.correct).length;
    const resp={
      id:newId(), ts:new Date().toISOString(), device:deviceLabel(),
      category:state.category, difficulty:state.difficulty,
      total:qs.length, score:score,
      prize: score>=CONFIG.prizeThreshold?"top":"part",
      answers: state.answers.map((a,i)=>({n:i, chosen:a?a.chosen:-1, correct:a?!!a.correct:false}))
    };
    const all=loadAll(); all.push(resp); saveAll(all);
    sendResult(resp);
    state.saved=true;
  }
  state.view="result"; render();
}

/* ============================================================
   集計
   ============================================================ */
function aggregate(data){
  const out={total:data.length, bySet:{}, perQ:{}, scoreDist:{}, prize:{top:0,part:0}, byDevice:{}};
  data.forEach(r=>{
    const sk=r.category+"|"+r.difficulty;
    out.bySet[sk]=(out.bySet[sk]||0)+1;
    out.prize[r.prize]=(out.prize[r.prize]||0)+1;
    out.scoreDist[r.score]=(out.scoreDist[r.score]||0)+1;
    const dev=r.device||"(未設定)"; out.byDevice[dev]=(out.byDevice[dev]||0)+1;
    (r.answers||[]).forEach(a=>{
      const qk=r.category+"|"+r.difficulty+"|"+a.n;
      if(!out.perQ[qk]) out.perQ[qk]={answered:0,correct:0};
      out.perQ[qk].answered++; if(a.correct) out.perQ[qk].correct++;
    });
  });
  return out;
}

  if(CONFIG.adminPin){

    if(!ok){
      const v=prompt("管理者用PINを入力してください");
      if(v!==CONFIG.adminPin){ alert("PINが違います"); location.hash=""; goHome(); return; }
      sessionStorage.setItem(CONFIG.storeKey+"_pinok","1");
    }
  }
  const data=currentData();
  const ag=aggregate(data);
  const dev=deviceLabel();

  let perQHtml="";
  Object.keys(QUIZ_DATA).forEach(cat=>{
    DIFFS.forEach(diff=>{
      const qs=QUIZ_DATA[cat][diff];
      const setCount=ag.bySet[cat+"|"+diff]||0;
      let rows="";
      qs.forEach((q,n)=>{
        const s=ag.perQ[cat+"|"+diff+"|"+n];
        const answered=s?s.answered:0, correct=s?s.correct:0;
        const rate=answered? Math.round(correct/answered*1000)/10 : 0;
        rows+=`<tr><td>Q${n+1}. ${esc(q.q)}</td><td class="num">${correct}/${answered}</td>
          <td style="width:90px;"><b>${answered?rate+"%":"-"}</b><div class="bar ${rateClass(rate)}"><i style="width:${answered?rate:0}%"></i></div></td></tr>`;
      });
      perQHtml+=`<div class="setblock"><h3><span class="pill ${cat}">${QUIZ_DATA[cat].emoji}</span> ${esc(CAT_LABEL[cat])} / ${DIFF_LABEL[diff]} <span class="pill">回答 ${setCount}件</span></h3>
        <table><thead><tr><th>設問</th><th class="num">正解/回答</th><th>正解率</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    });
  });

  let scoreRows="";
  for(let s=0;s<=7;s++){ if(ag.scoreDist[s]) scoreRows+=`<tr><td>${s}問正解</td><td class="num">${ag.scoreDist[s]}件</td></tr>`; }

  let devRows="";
  Object.keys(ag.byDevice).forEach(d=>{ devRows+=`<tr><td>${esc(d)}</td><td class="num">${ag.byDevice[d]}件</td></tr>`; });

  app.innerHTML = `
    <div class="card admin">
      <div class="topbar"><h2>📊 集計（スタッフ用）</h2><button class="btn ghost" style="width:auto;padding:8px 14px;font-size:14px;" data-action="home">クイズへ戻る</button></div>
      ${adminMerged?`<div class="banner">📥 取り込み合算データを表示中（合計 ${data.length}件）。<button class="link" data-action="resetMerge" style="margin-left:6px;">この端末のみに戻す</button></div>`:""}
      <div class="kpis">
        <div class="kpi"><div class="v">${ag.total}</div><div class="k">回答 合計件数</div></div>
        <div class="kpi"><div class="v">${ag.prize.top||0}</div><div class="k">上位賞（Google Home Mini）</div></div>
        <div class="kpi"><div class="v">${ag.prize.part||0}</div><div class="k">参加賞</div></div>
      </div>
      <div style="margin-top:12px;">
        <div class="row" style="flex-wrap:wrap;">
          <button class="btn" style="font-size:14px;" data-action="csvResp">📄 回答CSV</button>
          <button class="btn green" style="font-size:14px;" data-action="csvSummary">📈 設問別CSV</button>
        </div>
        <div style="height:10px;"></div>
        <div class="row" style="flex-wrap:wrap;">
          <button class="btn ghost" style="font-size:14px;" data-action="exportJson">💾 バックアップ(JSON)</button>
          <button class="btn amber" style="font-size:14px;" data-action="importJson">📥 他端末のJSONを合算</button>
        </div>
      </div>
    </div>

    <div class="card admin">
      <h3 style="margin-top:0;">設問ごとの正解率</h3>
      ${perQHtml}
    </div>

    <div class="card admin">
      <h3 style="margin-top:0;">得点の分布</h3>
      <table><tbody>${scoreRows||'<tr><td colspan="2">データなし</td></tr>'}</tbody></table>
      <h3>端末別の件数</h3>
      <table><tbody>${devRows||'<tr><td colspan="2">データなし</td></tr>'}</tbody></table>
    </div>

    <div class="card admin">
      <h3 style="margin-top:0;">この端末の設定</h3>
      <label style="font-size:13px;color:var(--muted);">端末名</label>
      <div class="row" style="margin-top:6px;">
        <input id="devInput" value="${esc(dev)}" placeholder="例：ブースA" style="flex:1;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;" />
        <button class="btn" style="width:auto;padding:12px 16px;" data-action="saveDevice">保存</button>
      </div>
      <details class="help"><summary>⚠ データ消去</summary>
        <p class="hint">この端末に保存した回答データをすべて消します。</p>
        <button class="btn" style="background:var(--red);" data-action="clearData">この端末のデータを全消去</button>
      </details>
    </div>`;
}

/* ============================================================
   CSV / JSON 入出力
   ============================================================ */
function csvCell(v){ const s=String(v==null?"":v); return '"'+s.replace(/"/g,'""')+'"'; }
function download(filename, text, mime){
  const blob=new Blob([text], {type:(mime||"text/plain")+";charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },300);
}
function stamp(){ const d=new Date(); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }

function exportResponsesCsv(){
  const data=currentData();
  const head=["ID","日時","端末","ジャンル","難易度","得点","満点","景品"];
  for(let i=1;i<=7;i++) head.push("Q"+i+"正誤");
  for(let i=1;i<=7;i++) head.push("Q"+i+"選択");
  const rows=[head.map(csvCell).join(",")];
  data.forEach(r=>{
    const row=[r.id, r.ts, r.device||"", CAT_LABEL[r.category]||r.category, DIFF_LABEL[r.difficulty]||r.difficulty,
               r.score, r.total, r.prize==="top"?CONFIG.topPrize:CONFIG.partPrize];
    for(let i=0;i<7;i++){ const a=(r.answers||[]).find(x=>x.n===i); row.push(a?(a.correct?1:0):""); }
    for(let i=0;i<7;i++){ const a=(r.answers||[]).find(x=>x.n===i); row.push(a?(a.chosen+1):""); }
    rows.push(row.map(csvCell).join(","));
  });
  download(`回答データ_${stamp()}.csv`, "\uFEFF"+rows.join("\r\n"), "text/csv");
}
function exportSummaryCsv(){
  const data=currentData(); const ag=aggregate(data);
  const rows=[["ジャンル","難易度","設問No","設問","回答数","正解数","正解率(%)"].map(csvCell).join(",")];
  Object.keys(QUIZ_DATA).forEach(cat=>{
    DIFFS.forEach(diff=>{
      QUIZ_DATA[cat][diff].forEach((q,n)=>{
        const s=ag.perQ[cat+"|"+diff+"|"+n]; const answered=s?s.answered:0, correct=s?s.correct:0;
        const rate=answered? Math.round(correct/answered*1000)/10 : "";
        rows.push([CAT_LABEL[cat], DIFF_LABEL[diff], "Q"+(n+1), q.q, answered, correct, rate].map(csvCell).join(","));
      });
    });
  });
  download(`設問別集計_${stamp()}.csv`, "\uFEFF"+rows.join("\r\n"), "text/csv");
}
function exportJson(){
  download(`バックアップ_${deviceLabel()||"端末"}_${stamp()}.json`, JSON.stringify(loadAll()), "application/json");
}
function importJson(files){
  if(!files||!files.length) return;
  let pending=files.length; let incoming=[];
  Array.from(files).forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{
      try{ const arr=JSON.parse(r.result); if(Array.isArray(arr)) incoming=incoming.concat(arr); }catch(e){ alert(f.name+" を読み込めませんでした"); }
      if(--pending===0){
        const map=new Map();
        (adminMerged||loadAll()).forEach(x=>x&&x.id&&map.set(x.id,x));
        incoming.forEach(x=>x&&x.id&&map.set(x.id,x));
        adminMerged=Array.from(map.values());
        render();
        alert("合算しました。現在 "+adminMerged.length+" 件を表示しています。");
      }
    };
    r.readAsText(f);
  });
}

/* ============================================================
   イベント処理
   ============================================================ */
app.addEventListener("click", e=>{
  const t=e.target.closest("[data-action]"); if(!t) return;
  const a=t.dataset.action, v=t.dataset.value;
  switch(a){
    case "toCategory": state.view="category"; render(); break;
    case "selectCategory": state.category=v; state.view="difficulty"; render(); break;
    case "selectDifficulty": startQuiz(state.category, v); break;
    case "choose": choose(parseInt(v,10)); break;
    case "next": next(); break;
    case "home": goHome(); break;
    case "restart": goHome(); break;
    case "retrySame": startQuiz(state.category, state.difficulty); break;
    case "csvResp": exportResponsesCsv(); break;
    case "csvSummary": exportSummaryCsv(); break;
    case "exportJson": exportJson(); break;
    case "importJson": document.getElementById("importFile").click(); break;
    case "resetMerge": adminMerged=null; render(); break;
    case "saveDevice": { const el=document.getElementById("devInput"); setDeviceLabel(el?el.value.trim():""); alert("端末名を保存しました"); render(); break; }
    case "flushNow": flushQueue(); alert("未送信データの再送信を試みました。"); setTimeout(render, 1200); break;
    case "clearData": if(confirm("この端末の回答データをすべて消去します。よろしいですか？")){ saveAll([]); adminMerged=null; alert("消去しました"); render(); } break;
  }
});
document.getElementById("importFile").addEventListener("change", e=>{ importJson(e.target.files); e.target.value=""; });
window.addEventListener("hashchange", render);

if("serviceWorker" in navigator && (location.protocol==="https:"||location.protocol==="http:")){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
window.addEventListener("online", flushQueue);
window.addEventListener("load", flushQueue);

render();
</script>
</body>
