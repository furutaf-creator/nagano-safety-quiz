<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="theme-color" content="#16a34a" /><title>長野の安全クイズに挑戦！</title><link rel="manifest" href="manifest.json" /><link rel="apple-touch-icon" href="icon.svg" /><style>  :root{    --blue:#1f6feb; --blue-d:#1648b0; --green:#16a34a; --green-d:#0f7a36;    --purple:#7c3aed; --purple-d:#5b21b6; --red:#dc2626; --amber:#f59e0b;    --ink:#1f2430; --muted:#64748b; --line:#e6e9f0; --bg:#f3f6fb; --card:#ffffff;    --ok-bg:#e7f8ee; --ng-bg:#fdeaea;  }  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}  html,body{margin:0;padding:0;}  body{    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;    color:var(--ink); background:var(--bg); line-height:1.6;    -webkit-text-size-adjust:100%;  }  .wrap{max-width:540px; margin:0 auto; padding:0 16px 40px; min-height:100vh; display:flex; flex-direction:column;}  header.app{    background:linear-gradient(135deg,var(--green),#3b82f6); color:#fff;    border-radius:0 0 22px 22px; padding:18px 18px 16px; margin:0 -16px 18px;    box-shadow:0 6px 18px rgba(22,163,74,.25);  }  header.app .ev{font-size:12px; opacity:.9; letter-spacing:.04em;}  header.app h1{font-size:19px; margin:2px 0 0; font-weight:800; letter-spacing:.01em;}  header.app .sub{font-size:12.5px; opacity:.95; margin-top:4px;}  .card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:0 2px 10px rgba(20,40,80,.04); margin-bottom:14px;}  h2{font-size:18px; margin:2px 0 10px; font-weight:800;}  p.lead{color:var(--muted); font-size:14px; margin:0 0 14px;}  .btn{    display:flex; align-items:center; gap:10px; width:100%; border:none; cursor:pointer;    font-family:inherit; font-size:16px; font-weight:700; color:#fff; background:var(--green);    padding:15px 16px; border-radius:14px; text-align:left; transition:transform .05s ease, filter .15s ease;  }  .btn:active{transform:scale(.985);}  .btn.lg{font-size:17px; padding:17px;}  .btn.green{background:var(--green);} .btn.purple{background:var(--purple);}  .btn.ghost{background:#eef2f9; color:var(--ink); font-weight:700; border:1px solid var(--line);}  .btn.amber{background:var(--amber); color:#3a2a00;}  .btn .emj{font-size:22px; line-height:1;}  .btn .meta{font-size:12px; font-weight:600; opacity:.92; display:block; margin-top:2px;}  .btn .col{display:flex; flex-direction:column;}  .row{display:flex; gap:10px;}  .row .btn{flex:1;}  .pill{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; background:#eef2f9; color:var(--muted);}  .pill.safety{background:#e7f8ee; color:var(--green-d);}  .pill.ai{background:#e8f0ff; color:var(--blue-d);}  .pill.kids{background:#e7f8ee; color:var(--green-d);}  .pill.normal{background:#e8f0ff; color:var(--blue-d);}  .pill.hard{background:#f1e9ff; color:var(--purple-d);}  .note{font-size:12px; color:var(--muted); background:#f6f8fc; border:1px dashed var(--line); border-radius:12px; padding:10px 12px;}  .progress{height:9px; background:#e8edf6; border-radius:999px; overflow:hidden; margin:4px 0 14px;}  .progress > i{display:block; height:100%; background:linear-gradient(90deg,var(--green),#5b9bff); border-radius:999px; transition:width .25s ease;}  .qhead{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--muted); margin-bottom:6px;}  .qtext{font-size:18px; font-weight:800; margin:2px 0 14px; line-height:1.5;}  .choice{    width:100%; text-align:left; background:#fff; border:2px solid var(--line); color:var(--ink);    font-family:inherit; font-size:15.5px; font-weight:600; padding:14px 14px; border-radius:13px;    margin-bottom:10px; cursor:pointer; display:flex; gap:10px; align-items:flex-start; line-height:1.45;  }  .choice:active{transform:scale(.99);}  .choice .mk{flex:0 0 26px; height:26px; border-radius:50%; background:#eef2f9; color:var(--muted); font-weight:800; display:flex; align-items:center; justify-content:center; font-size:14px;}  .choice.ok{border-color:var(--green); background:var(--ok-bg);}  .choice.ok .mk{background:var(--green); color:#fff;}  .choice.ng{border-color:var(--red); background:var(--ng-bg);}  .choice.ng .mk{background:var(--red); color:#fff;}  .choice.dim{opacity:.6;}  .choice:disabled{cursor:default;}  .fb{border-radius:13px; padding:12px 14px; margin:4px 0 12px; font-size:14px; font-weight:600;}  .fb.ok{background:var(--ok-bg); color:var(--green-d);}  .fb.ng{background:var(--ng-bg); color:#9b1c1c;}  .fb .ttl{font-weight:800; display:block; margin-bottom:2px;}  .kids .qtext{font-size:20px;}  .kids .choice{font-size:17px;}  .result-score{text-align:center; padding:6px 0 2px;}  .result-score .big{font-size:46px; font-weight:900; line-height:1; color:var(--green);}  .result-score .big small{font-size:20px; color:var(--muted); font-weight:800;}  .prize{border-radius:16px; padding:16px; text-align:center; margin:12px 0; color:#fff;}  .prize.top{background:linear-gradient(135deg,#f59e0b,#f97316);}  .prize.part{background:linear-gradient(135deg,#34a0ff,#1f6feb);}  .prize .lab{font-size:12px; font-weight:700; opacity:.95;}  .prize .name{font-size:24px; font-weight:900; margin-top:2px;}  .prize .emj{font-size:30px;}  .staff{font-size:12px; color:var(--muted); text-align:center; margin-top:-4px;}  .cta{background:#f0f6ff; border:1px solid #d6e6ff; border-radius:16px; padding:14px; margin-top:6px;}  .cta h3{margin:0 0 8px; font-size:15px;}  .cta ul{margin:0; padding-left:18px; font-size:13.5px; color:#334155;}  .cta li{margin:4px 0;}  footer.app{margin-top:auto; padding-top:14px; text-align:center; font-size:11.5px; color:var(--muted);}  footer.app a{color:var(--muted);}  .admin h2{margin-top:0;}  table{width:100%; border-collapse:collapse; font-size:12.5px;}  th,td{border-bottom:1px solid var(--line); padding:7px 6px; text-align:left; vertical-align:top;}  th{color:var(--muted); font-weight:700; font-size:11.5px;}  td.num,th.num{text-align:right; white-space:nowrap;}  .bar{height:7px; background:#eef2f9; border-radius:999px; overflow:hidden; margin-top:3px;}  .bar > i{display:block; height:100%; background:var(--green);}  .bar.low > i{background:var(--red);} .bar.mid > i{background:var(--amber);} .bar.high > i{background:var(--green);}  .kpis{display:flex; gap:8px; flex-wrap:wrap;}  .kpi{flex:1; min-width:90px; background:#f6f8fc; border:1px solid var(--line); border-radius:12px; padding:10px 12px;}  .kpi .v{font-size:22px; font-weight:900;}  .kpi .k{font-size:11px; color:var(--muted);}  .setblock{margin:12px 0 4px;}  .setblock h3{font-size:14px; margin:0 0 4px; display:flex; gap:8px; align-items:center;}  .banner{background:#fff7e6; border:1px solid #ffe2a8; color:#7a5200; border-radius:12px; padding:10px 12px; font-size:12.5px; margin-bottom:12px;}  details.help{margin-top:8px;} details.help summary{cursor:pointer; font-size:13px; font-weight:700; color:var(--blue-d);}  .hint{font-size:12px; color:var(--muted); margin-top:6px;}  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}  .link{background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; font-family:inherit; text-decoration:underline; padding:0;}</style></head><body><div class="wrap">  <header class="app">    <div class="ev" id="evName">SmartLife 大学文化祭参加企画</div>    <h1>長野の安全クイズに挑戦！ 🛡️🌲</h1>    <div class="sub" id="evSub">クイズに答えてオリジナルグッズをGET！</div>  </header>

<script>/* ============================================================   設定   ============================================================ */const CONFIG = {  prizeThreshold: 6,            // 7問中6問以上で全問正解賞／特別賞  topPrize:        "オリジナル安全グッズ（全問正解）",  topPrizeEmoji:   "🎁",  partPrize:       "オリジナルノベルティ（参加賞）",  partPrizeEmoji:  "✨",
  eventName: "SmartLife 大学文化祭参加企画",  eventSub:  "長野の安全について楽しく学んで行動につなげよう！",
  cta: {    title: "📣 楽しく学んで、大切な人を守ろう！",    items: [      "特殊詐欺・SNS詐欺の最新手口に気をつけましょう！",      "地震や台風など、日頃から家族でハザードマップを確認しておきましょう。",      "インターネットやスマホを安全に使うポイントを周囲にも共有しましょう！"    ]  },  submitUrl: "",  storeKey: "nagano_safety_quiz_v1",  adminPin: ""};
/* ============================================================   クイズデータ（チラシ記載の4テーマに準拠）   ・safety: 特殊詐欺・SNS詐欺＆災害への備え   ・ai: ネットの安全な使い方＆身近な防犯対策   ============================================================ */const QUIZ_DATA = {  safety: {    label: "詐欺対策・防災編", emoji: "🚨",    kids: [      {q:"知らない番号から電話で「お金を振込んで」と言われたらどうする？",       choices:["すぐにお金を振り込む","電話を切っておうちの人や警察に相談する","友達に教える"], answer:1,       explain:"知らない番号からの「お金を出して」は詐欺の危険大！すぐ大人に相談しよう。"},      {q:"地震が起きたとき、最初にすることは何？",       choices:["あわてて外に飛び出す","頭を守って低い姿勢をとる","大きな声を出す"], answer:1,       explain:"まずは机の下に入るなどして、頭を守る行動が最優先です。"},      {q:"台風で川の水が増えているとき、見に行っていい？",       choices:["ぜったいに見に行かない","近くで見てみる","友達と見に行く"], answer:0,       explain:"川や用水路は大変危険です。近づかないようにしましょう。"},      {q:"「プレゼントが当たった」という怪しいメールが届いたら？",       choices:["すぐに開く","大人の人に確認してもらう","自分の住所を入力する"], answer:1,       explain:"怪しいリンクは開かず、大人に確認してもらいましょう。"},      {q:"避難（ひなん）するときに持っていくと良いものは？",       choices:["重い本やゲーム","非常用の持ち出しリュック","大きなおもちゃ"], answer:1,       explain:"水やライトが入った非常用リュックを準備しておこう。"},      {q:"SNSで知らない人から「会おう」と言われたらどうする？",       choices:["ひとりで会いに行く","断っておうちの人に伝える","待ち合わせ場所を教える"], answer:1,       explain:"ネットで知り合った人と勝手に会うのはとても危険です。"},      {q:"家にひとりでいるときに知らない人が来たら？",       choices:["ドアをすぐに開ける","カギを開けずに居居居居対応し大人に伝える","部屋で遊ぶ"], answer:1,       explain:"一人留守番のときは安易にドアを開けないようにしましょう。"},    ],    normal: [      {q:"「市役所ですが高額な還付金があります。ATMへ行ってください」という電話が来た。どうする？",       choices:["指示に従いATMへ行く","詐欺を疑い、電話を切り市役所の公式窓口へ確認する","記載の番号にかけ直す"], answer:1,       explain:"「ATMで還付金の手続き」は100%詐欺です。絶対にATMへ行ってはいけません。"},      {q:"SNSの投資広告で「絶対儲かる」と誘われ、個人の口座へ送金を求められた。適切な対応は？",       choices:["少額なら試してみる","SNS型の投資詐欺を疑い送金しない","友達にも紹介する"], answer:1,       explain:"SNSを悪用した詐欺が急増中。「絶対儲かる」「個人口座への振込」は詐欺の手口です。"},      {q:"長野県内でも懸念される大地震。家庭で「最低限」備えておくべき飲料水は一人一日何リットル？",       choices:["約1リットル","約3リットル","約10リットル"], answer:1,       explain:"防災の基本として、飲料水は一人一日「3リットル」×最低3日分（計9L）の備えが推奨されます。"},      {q:"ハザードマップ（防災マップ）の役割として正しいものはどれ？",       choices:["避難所の場所や水害・土砂災害のリスクを確認できる","過去の天気予報を見るこ const DIFFS = ["kids","normal","hard"];const DIFF_LABEL = {kids:"こども（小学生）", normal:"ふつう", hard:"むずかしい"};const DIFF_SUB   = {kids:"やさしい言葉で出題します", normal:"身近な安全チェック", hard:"知識をしっかり確認"};const CAT_LABEL  = {safety:"詐欺対策・防災編", ai:"ネット安全・防犯編"};
/* ============================================================   状態・ユーティリティ   ============================================================ */let state = {view:"home", category:null, difficulty:null, qIndex:0, answers:[], locked:false, saved:false};let adminMerged = null;
const app = document.getElementById("app");const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function loadAll(){ try{ return JSON.parse(localStorage.getItem(CONFIG.storeKey)) || []; }catch(e){ return []; } }function saveAll(arr){ try{ localStorage.setItem(CONFIG.storeKey, JSON.stringify(arr)); }catch(e){ alert("保存容量がいっぱいです。集計画面からデータを書き出して消去してください。"); } }function deviceLabel(){ return localStorage.getItem(CONFIG.storeKey+"_device") || ""; }function setDeviceLabel(v){ localStorage.setItem(CONFIG.storeKey+"_device", v||""); }function newId(){ return Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8); }
/* ---- オンライン送信＋オフライン退避 ---- */function queueLoad(){ try{ return JSON.parse(localStorage.getItem(CONFIG.storeKey+"_queue"))||[]; }catch(e){ return []; } }function queueSave(q){ try{ localStorage.setItem(CONFIG.storeKey+"_queue", JSON.stringify(q)); }catch(e){} }function sendResult(resp){  if(!CONFIG.submitUrl) return;  fetch(CONFIG.submitUrl, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(resp)})    .catch(()=>{ const q=queueLoad(); q.push(resp); queueSave(q); });}function flushQueue(){  if(!CONFIG.submitUrl) return;  const items=queueLoad(); if(!items.length) return;  let remaining=items.length, failed=[];  items.forEach(it=>{    fetch(CONFIG.submitUrl, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(it)})      .catch(()=>{ failed.push(it); })      .finally(()=>{ if(--remaining===0){ queueSave(failed); if(location.hash==="#admin") render(); } });  });}
function goHome(){ state={view:"home",category:null,difficulty:null,qIndex:0,answers:[],locked:false,saved:false,shuffled:[]}; if(location.hash) history.replaceState(null,"","#"); render(); }
/* ============================================================   画面描画   ============================================================ */function render(){  document.getElementById("evName").textContent = CONFIG.eventName;  document.getElementById("evSub").textContent  = CONFIG.eventSub;
  if(location.hash === "#admin"){ renderAdmin(); return; }  switch(state.view){    case "home":       renderHome(); break;    case "category":   renderCategory(); break;    case "difficulty": renderDifficulty(); break;    case "quiz":       renderQuiz(); break;    case "result":     renderResult(); break;    default:           renderHome();  }  window.scrollTo(0,0);}
function renderHome(){  app.innerHTML = `    <div class="card">      <h2>ようこそ！🎉</h2>      <p class="lead">楽しく学んで、自分と大切な人を守ろう！全${QUIZ_DATA.safety.normal.length}問の安全クイズに答えて景品をゲットしよう。</p>      <button class="btn lg green" data-action="toCategory"><span class="emj">▶️</span><span class="col">クイズをはじめる<span class="meta">所要時間 5〜10分 ｜ 参加無料</span></span></button>      <div class="note" style="margin-top:12px;">🎁 参加者プレゼント：全問を目指そう！参加してくれた方全員にオリジナルグッズをお渡しします（※なくなり次第終了）。</div>    </div>    <div class="card">      <h3 style="margin:0 0 8px; font-size:14px;">クイズで学べるテーマ</h3>      <div class="row" style="gap:10px;">        <div class="kpi"><div class="v">🚨</div><div class="k">特殊詐欺・災害の備え</div></div>        <div class="kpi"><div class="v">🌐</div><div class="k">ネット安全・身近な防犯</div></div>      </div>      <div class="hint">難易度は「こども／ふつう／むずかしい」から選べます。</div>    </div>`;}
function renderCategory(){  app.innerHTML = `    <div class="topbar"><button class="btn ghost" style="width:auto;padding:8px 14px;font-size:14px;" data-action="home">← もどる</button><span class="pill">ジャンルをえらぶ</span></div>    <div class="card">      <h2>どちらのテーマに挑戦しますか？</h2>      <button class="btn lg green" data-action="selectCategory" data-value="safety"><span class="emj">🚨</span><span class="col">詐欺対策・防災編<span class="meta">特殊詐欺・SNS詐欺・地震や台風への備え</span></span></button>      <div style="height:10px;"></div>      <button class="btn lg" data-action="selectCategory" data-value="ai"><span class="emj">🌐</span><span class="col">ネット安全・防犯編<span class="meta">インターネットの安全利用・身近な防犯対策</span></span></button>    </div>`;}
function renderDifficulty(){  const cat = state.category;  const colors = {kids:"green", normal:"", hard:"purple"};  let btns = DIFFS.map(d=>`    <button class="btn lg ${colors[d]}" data-action="selectDifficulty" data-value="${d}">      <span class="emj">${d==="kids"?"🧒":d==="normal"?"🙂":"🧠"}</span>      <span class="col">${DIFF_LABEL[d]}<span class="meta">${DIFF_SUB[d]}</span></span>    </button><div style="height:10px;"></div>`).join("");  app.innerHTML = `    <div class="topbar"><button class="btn ghost" style="width:auto;padding:8px 14px;font-size:14px;" data-action="toCategory">← もどる</button><span class="pill ${cat}">${QUIZ_DATA[cat].emoji} ${esc(CAT_LABEL[cat])}</span></div>    <div class="card">      <h2>むずかしさをえらんでね</h2>      ${btns}    </div>`;}
function renderQuiz(){  const cat=state.category, diff=state.difficulty;  const qs=state.shuffled, total=qs.length;  const q=currentQ();  const ans=state.answers[state.qIndex];  const pct=Math.round((state.qIndex+(state.locked?1:0))/total*100);  const marks=["ア","イ","ウ","エ","オ"];  let choices = q.choices.map((c,i)=>{    let cls="choice"; let disabled="";    if(state.locked){      disabled="disabled";      if(i===q.answer) cls+=" ok";      else if(ans && i===ans.chosen) cls+=" ng";      else cls+=" dim";    }    return `<button class="${cls}" ${disabled} data-action="choose" data-value="${i}"><span class="mk">${marks[i]||(i+1)}</span><span>${esc(c)}</span></button>`;  }).join("");  let feedback="";  if(state.locked){    const ok=ans && ans.correct;    feedback=`<div class="fb ${ok?"ok":"ng"}"><span class="ttl">${ok?"⭕ 正解！":"❌ 残念…"}</span>${esc(q.explain)}</div>      <button class="btn ${ok?"green":""}" data-action="next">${state.qIndex<total-1?"次の問題へ ▶":"結果を見る 🎁"}</button>`;  }  app.innerHTML = `    <div class="card ${diff}">      <div class="qhead"><span class="pill ${cat}">${QUIZ_DATA[cat].emoji} ${esc(CAT_LABEL[cat])} / ${DIFF_LABEL[diff]}</span><span>第 ${state.qIndex+1} 問 / ${total}</span></div>      <div class="progress"><i style="width:${pct}%"></i></div>      <div class="qtext">${esc(q.q)}</div>      ${choices}      ${feedback}    </div>    ${!state.locked?'<div class="hint">こたえを1つタップしてください。</div>':''}`;}
function renderResult(){  const cat=state.category, diff=state.difficulty;  const qs=QUIZ_DATA[cat][diff], total=qs.length;  const score=state.answers.filter(a=>a&&a.correct).length;  const isTop = score>=CONFIG.prizeThreshold;  const prizeName = isTop?CONFIG.topPrize:CONFIG.partPrize;  const prizeEmoji= isTop?CONFIG.topPrizeEmoji:CONFIG.partPrizeEmoji;  const ctaItems = CONFIG.cta.items.map(i=>`<li>${esc(i)}</li>`).join("");  app.innerHTML = `    <div class="card">      <h2 style="text-align:center;">クイズ結果 🎊</h2>      <div class="result-score"><span class="big">${score}<small> / ${total} 問正解</small></span></div>      <div class="pill ${cat}" style="display:block;text-align:center;margin:10px auto 0;width:max-content;">${QUIZ_DATA[cat].emoji} ${esc(CAT_LABEL[cat])} / ${DIFF_LABEL[diff]}</div>      <div class="prize ${isTop?"top":"part"}">        <div class="emj">${prizeEmoji}</div>        <div class="lab">${isTop?"🎉 全問正解おめでとうございます！":"✨ ご参加ありがとうございます！"}</div>        <div class="name">${esc(prizeName)}</div>      </div>      <div class="staff" style="font-size:18px; font-weight:900; color:var(--ink); background:#fff3cd; border:2px solid var(--amber); border-radius:12px; padding:12px 10px; margin-top:6px; letter-spacing:.02em;">📲 この画面をブースのスタッフにお見せください<br><span style="font-size:13px; font-weight:700; color:var(--muted);">オリジナルグッズとお引換えします</span></div>    </div>    <div class="card">      <div class="cta">        <h3>${esc(CONFIG.cta.title)}</h3>        <ul>${ctaItems}</ul>      </div>    </div>    <div class="row">      <button class="btn ghost" data-action="restart">🏠 最初にもどる</button>      <button class="btn green" data-action="retrySame">🔁 もう一度</button>    </div>`;}
/* ============================================================   クイズ進行   ============================================================ */function shuffleQuestions(cat, diff){  return QUIZ_DATA[cat][diff].map(q=>{    const idx = [0,1,2];    for(let i=idx.length-1; i>0; i--){      const j = Math.floor(Math.random()*(i+1));      [idx[i],idx[j]] = [idx[j],idx[i]];    }    const newChoices = idx.map(i=>q.choices[i]);    const newAnswer  = idx.indexOf(q.answer);    return {...q, choices:newChoices, answer:newAnswer};  });}
function startQuiz(cat,diff){  state.category=cat; state.difficulty=diff; state.qIndex=0; state.answers=[]; state.locked=false; state.saved=false; state.view="quiz";  state.shuffled = shuffleQuestions(cat, diff);  render();}function currentQ(){ return state.shuffled[state.qIndex]; }function choose(i){  if(state.locked) return;  const q=currentQ();  state.answers[state.qIndex]={chosen:i, correct:i===q.answer};  state.locked=true; render();}function next(){  if(state.qIndex<state.shuffled.length-1){ state.qIndex++; state.locked=false; render(); }  else finish();}function finish(){  if(!state.saved){    const qs=state.shuffled;    const score=state.answers.filter(a=>a&&a.correct).length;    const resp={      id:newId(), ts:new Date().toISOString(), device:deviceLabel(),      category:state.category, difficulty:state.difficulty,      total:qs.length, score:score,      prize: score>=CONFIG.prizeThreshold?"top":"part",      answers: state.answers.map((a,i)=>({n:i, chosen:a?a.chosen:-1, correct:a?!!a.correct:false}))    };    const all=loadAll(); all.push(resp); saveAll(all);    sendResult(resp);    state.saved=true;  }  state.view="result"; render();}
/* ============================================================   集計   ============================================================ */function aggregate(data){  const out={total:data.length, bySet:{}, perQ:{}, scoreDist:{}, prize:{top:0,part:0}, byDevice:{}};  data.forEach(r=>{    const sk=r.category+"|"+r.difficulty;    out.bySet[sk]=(out.bySet[sk]||0)+1;    out.prize[r.prize]=(out.prize[r.prize]||0)+1;    out.scoreDist[r.score]=(out.scoreDist[r.score]||0)+1;    const dev=r.device||"(未設定)"; out.byDevice[dev]=(out.byDevice[dev]||0)+1;    (r.answers||[]).forEach(a=>{      const qk=r.category+"|"+r.difficulty+"|"+a.n;      if(!out.perQ[qk]) out.perQ[qk]={answered:0,correct:0};      out.perQ[qk].answered++; if(a.correct) out.perQ[qk].correct++;    });  });  return out;}function currentData(){  if(adminMerged) return adminMerged;  return loadAll();}function rateClass(p){ return p<50?"low":p<80?"mid":"high"; }
function renderAdmin(){  if(CONFIG.adminPin){    const ok=sessionStorage.getItem(CONFIG.storeKey+"_pinok");    if(!ok){      const v=prompt("管理者用PINを入力してください");      if(v!==CONFIG.adminPin){ alert("PINが違います"); location.hash=""; goHome(); return; }      sessionStorage.setItem(CONFIG.storeKey+"_pinok","1");    }  }  const data=currentData();  const ag=aggregate(data);  const dev=deviceLabel();  const queued=queueLoad().length;  const sendSet=!!CONFIG.submitUrl;
  let perQHtml="";  Object.keys(QUIZ_DATA).forEach(cat=>{    DIFFS.forEach(diff=>{      const qs=QUIZ_DATA[cat][diff];      const setCount=ag.bySet[cat+"|"+diff]||0;      let rows="";      qs.forEach((q,n)=>{        const s=ag.perQ[cat+"|"+diff+"|"+n];        const answered=s?s.answered:0, correct=s?s.correct:0;        const rate=answered? Math.round(correct/answered*1000)/10 : 0;        rows+=`<tr><td>Q${n+1}. ${esc(q.q)}</td><td class="num">${correct}/${answered}</td>          <td style="width:90px;"><b>${answered?rate+"%":"-"}</b><div class="bar ${rateClass(rate)}"><i style="width:${answered?rate:0}%"></i></div></td></tr>`;      });      perQHtml+=`<div class="setblock"><h3><span class="pill ${cat}">${QUIZ_DATA[cat].emoji}</span> ${esc(CAT_LABEL[cat])} / ${DIFF_LABEL[diff]} <span class="pill">回答 ${setCount}件</span></h3>        <table><thead><tr><th>設問</th><th class="num">正解/回答</th><th>正解率</th></tr></thead><tbody>${rows}</tbody></table></div>`;    });  });
  let scoreRows="";  for(let s=0;s<=7;s++){ if(ag.scoreDist[s]) scoreRows+=`<tr><td>${s}問正解</td><td class="num">${ag.scoreDist[s]}件</td></tr>`; }
  let devRows="";  Object.keys(ag.byDevice).forEach(d=>{ devRows+=`<tr><td>${esc(d)}</td><td class="num">${ag.byDevice[d]}件</td></tr>`; });
  app.innerHTML = `    <div class="card admin">      <div class="topbar"><h2>📊 集計（スタッフ用）</h2><button class="btn ghost" style="width:auto;padding:8px 14px;font-size:14px;" data-action="home">クイズへ戻る</button></div>      ${adminMerged?`<div class="banner">📥 取り込み合算データを表示中（合計 ${data.length}件）。<button class="link" data-action="resetMerge" style="margin-left:6px;">この端末のみに戻す</button></div>`:""}      <div class="kpis">        <div class="kpi"><div class="v">${ag.total}</div><div class="k">回答 合計件数</div></div>        <div class="kpi"><div class="v">${ag.prize.top||0}</div><div class="k">上位賞（全問正解）</div></div>        <div class="kpi"><div class="v">${ag.prize.part||0}</div><div class="k">参加賞</div></div>      </div>      <div style="margin-top:12px;">        <div class="row" style="flex-wrap:wrap;">          <button class="btn" style="font-size:14px;" data-action="csvResp">📄 回答CSV</button>          <button class="btn green" style="font-size:14px;" data-action="csvSummary">📈 設問別CSV</button>        </div>        <div style="height:10px;"></div>        <div class="row" style="flex-wrap:wrap;">          <button class="btn ghost" style="font-size:14px;" data-action="exportJson">💾 バックアップ(JSON)</button>          <button class="btn amber" style="font-size:14px;" data-action="importJson">📥 他端末のJSONを合算</button>        </div>      </div>    </div>
    <div class="card admin">      <h3 style="margin-top:0;">設問ごとの正解率</h3>      ${perQHtml}    </div>
    <div class="card admin">      <h3 style="margin-top:0;">得点の分布</h3>      <table><tbody>${scoreRows||'<tr><td colspan="2">データなし</td></tr>'}</tbody></table>      <h3>端末別の件数</h3>      <table><tbody>${devRows||'<tr><td colspan="2">データなし</td></tr>'}</tbody></table>    </div>
    <div class="card admin">      <h3 style="margin-top:0;">この端末の設定</h3>      <label style="font-size:13px;color:var(--muted);">端末名</label>      <div class="row" style="margin-top:6px;">        <input id="devInput" value="${esc(dev)}" placeholder="例：ブースA" style="flex:1;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;" />        <button class="btn" style="width:auto;padding:12px 16px;" data-action="saveDevice">保存</button>      </div>      <details class="help"><summary>⚠️ データ消去</summary>        <p class="hint">この端末に保存した回答データをすべて消します。</p>        <button class="btn" style="background:var(--red);" data-action="clearData">この端末のデータを全消去</button>      </details>    </div>`;}
/* ============================================================   CSV / JSON 入出力   ============================================================ */function csvCell(v){ const s=String(v==null?"":v); return '"'+s.replace(/"/g,'""')+'"'; }function download(filename, text, mime){  const blob=new Blob([text], {type:(mime||"text/plain")+";charset=utf-8"});  const url=URL.createObjectURL(blob);  const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click();  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },300);}function stamp(){ const d=new Date(); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
function exportResponsesCsv(){  const data=currentData();  const head=["ID","日時","端末","ジャンル","難易度","得点","満点","景品"];  for(let i=1;i<=7;i++) head.push("Q"+i+"正誤");  for(let i=1;i<=7;i++) head.push("Q"+i+"選択");  const rows=[head.map(csvCell).join(",")];  data.forEach(r=>{    const row=[r.id, r.ts, r.device||"", CAT_LABEL[r.category]||r.category, DIFF_LABEL[r.difficulty]||r.difficulty,               r.score, r.total, r.prize==="top"?CONFIG.topPrize:CONFIG.partPrize];    for(let i=0;i<7;i++){ const a=(r.answers||[]).find(x=>x.n===i); row.push(a?(a.correct?1:0):""); }    for(let i=0;i<7;i++){ const a=(r.answers||[]).find(x=>x.n===i); row.push(a?(a.chosen+1):""); }    rows.push(row.map(csvCell).join(","));  });  download(`回答データ_${stamp()}.csv`, "﻿"+rows.join("\r\n"), "text/csv");}function exportSummaryCsv(){  const data=currentData(); const ag=aggregate(data);  const rows=[["ジャンル","難易度","設問No","設問","回答数","正解数","正解率(%)"].map(csvCell).join(",")];  Object.keys(QUIZ_DATA).forEach(cat=>{    DIFFS.forEach(diff=>{      QUIZ_DATA[cat][diff].forEach((q,n)=>{        const s=ag.perQ[cat+"|"+diff+"|"+n]; const answered=s?s.answered:0, correct=s?s.correct:0;        const rate=answered? Math.round(correct/answered*1000)/10 : "";        rows.push([CAT_LABEL[cat], DIFF_LABEL[diff], "Q"+(n+1), q.q, answered, correct, rate].map(csvCell).join(","));      });    });  });  download(`設問別集計_${stamp()}.csv`, "﻿"+rows.join("\r\n"), "text/csv");}function exportJson(){  download(`バックアップ_${deviceLabel()||"端末"}_${stamp()}.json`, JSON.stringify(loadAll()), "application/json");}function importJson(files){  if(!files||!files.length) return;  let pending=files.length; let incoming=[];  Array.from(files).forEach(f=>{    const r=new FileReader();    r.onload=()=>{      try{ const arr=JSON.parse(r.result); if(Array.isArray(arr)) incoming=incoming.concat(arr); }catch(e){ alert(f.name+" を読み込めませんでした"); }      if(--pending===0){        const map=new Map();        (adminMerged||loadAll()).forEach(x=>x&&x.id&&map.set(x.id,x));        incoming.forEach(x=>x&&x.id&&map.set(x.id,x));        adminMerged=Array.from(map.values());        render();        alert("合算しました。現在 "+adminMerged.length+" 件を表示しています。");      }    };    r.readAsText(f);  });}
/* ============================================================   イベント処理   ============================================================ */app.addEventListener("click", e=>{  const t=e.target.closest("[data-action]"); if(!t) return;  const a=t.dataset.action, v=t.dataset.value;  switch(a){    case "toCategory": state.view="category"; render(); break;    case "selectCategory": state.category=v; state.view="difficulty"; render(); break;    case "selectDifficulty": startQuiz(state.category, v); break;    case "choose": choose(parseInt(v,10)); break;    case "next": next(); break;    case "home": goHome(); break;    case "restart": goHome(); break;    case "retrySame": startQuiz(state.category, state.difficulty); break;    case "csvResp": exportResponsesCsv(); break;    case "csvSummary": exportSummaryCsv(); break;    case "exportJson": exportJson(); break;    case "importJson": document.getElementById("importFile").click(); break;    case "resetMerge": adminMerged=null; render(); break;    case "saveDevice": { const el=document.getElementById("devInput"); setDeviceLabel(el?el.value.trim():""); alert("端末名を保存しました"); render(); break; }    case "flushNow": flushQueue(); alert("未送信データの再送信を試みました。"); setTimeout(render, 1200); break;    case "clearData": if(confirm("この端末の回答データをすべて消去します。よろしいですか？")){ saveAll([]); adminMerged=null; alert("消去しました"); render(); } break;  }});document.getElementById("importFile").addEventListener("change", e=>{ importJson(e.target.files); e.target.value=""; });window.addEventListener("hashchange", render);
if("serviceWorker" in navigator && (location.protocol==="https:"||location.protocol==="http:")){  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });}window.addEventListener("online", flushQueue);window.addEventListener("load", flushQueue);
render();</script></body></html>
